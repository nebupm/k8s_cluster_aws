repos:
  - repo: local
    hooks:
      # Formats all Terraform files recursively from the repo root
      - id: terraform-fmt
        name: Terraform Format
        entry: terraform fmt -recursive
        language: system
        files: \.tf$
        pass_filenames: false

      # Validates the root module.
      # Skips gracefully if terraform init has not been run (first commit / fresh clone).
      # To enable: terraform init -backend-config=backends/<team>-<env>.hcl
      - id: terraform-validate-root
        name: Terraform Validate (root module)
        entry: "bash -c 'if test -d terraform/.terraform/providers; then terraform -chdir=terraform validate; else echo \"SKIP: terraform not initialised in terraform/ — run terraform init to enable validation.\"; fi'"
        language: system
        files: ^terraform/(?!bootstrap/).*\.tf$
        pass_filenames: false

      # Validates the bootstrap module.
      # Skips gracefully if terraform init has not been run.
      # To enable: terraform -chdir=terraform/bootstrap init
      - id: terraform-validate-bootstrap
        name: Terraform Validate (bootstrap)
        entry: "bash -c 'if test -d terraform/bootstrap/.terraform/providers; then terraform -chdir=terraform/bootstrap validate; else echo \"SKIP: terraform not initialised in terraform/bootstrap/ — run terraform init to enable validation.\"; fi'"
        language: system
        files: ^terraform/bootstrap/.*\.tf$
        pass_filenames: false

      # Lints all modules recursively using the aws ruleset.
      # Uses a wrapper script to pass an absolute path to .tflint.hcl — required because
      # tflint --recursive resolves --config relative to each subdirectory it descends into.
      - id: tflint
        name: TFLint
        entry: terraform/scripts/run_tflint.sh
        language: script
        files: \.tf$
        pass_filenames: false

      # Generates variable/output documentation for the root module
      - id: terraform-docs
        name: Terraform Docs
        entry: terraform-docs markdown table --output-file README.md --output-mode inject terraform
        language: system
        files: ^terraform/.*\.tf$
        pass_filenames: false
