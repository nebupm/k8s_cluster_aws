---
# roles/common/tasks/main.yml

- name: Set SELinux to permissive
  selinux:
    policy: targeted
    state: permissive

- name: Disable swap
  command: swapoff -a
  when: ansible_facts.swaptotal_mb > 0

- name: Remove swap entry from /etc/fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+.*)$'
    replace: '# \1'

- name: Load kernel modules
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules
  copy:
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/k8s.conf

- name: Set sysctl parameters for K8s
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
    - { name: 'net.ipv4.ip_forward', value: '1' }

- name: Install chrony
  dnf:
    name: chrony
    state: present

- name: Enable and start chronyd
  systemd:
    name: chronyd
    state: started
    enabled: yes

- name: Force time synchronization
  command: chronyc -a makestep
  become: yes
  ignore_errors: yes
  register: time_sync
  changed_when: "'200 OK' in time_sync.stdout"

- name: Add Docker CE repo (provides containerd.io)
  get_url:
    url: https://download.docker.com/linux/centos/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo

- name: Add Kubernetes dnf repository
  yum_repository:
    name: kubernetes
    description: Kubernetes
    baseurl: "{{ kubernetes_rpm_repo }}"
    enabled: yes
    gpgcheck: yes
    gpgkey: "{{ kubernetes_rpm_key_url }}"
    exclude: "kubelet kubeadm kubectl cri-tools kubernetes-cni"

- name: Install containerd
  dnf:
    name: containerd.io
    state: present

- name: Create containerd config directory
  file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Configure containerd
  shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Set SystemdCgroup to true in containerd config
  replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'

- name: Restart containerd
  systemd:
    name: containerd
    state: restarted
    enabled: yes

- name: Install K8s tools
  dnf:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    disable_excludes: kubernetes

- name: Enable kubelet
  systemd:
    name: kubelet
    enabled: yes
