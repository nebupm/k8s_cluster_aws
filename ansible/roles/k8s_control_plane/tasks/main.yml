---
# roles/k8s_control_plane/tasks/main.yml

- name: Initialize the first manager
  shell: |
    kubeadm init --pod-network-cidr={{ pod_network_cidr }} \
                 --control-plane-endpoint="{{ k8s_api_endpoint | default(hostvars[groups['k8s_manager'][0]]['ansible_host']) }}:6443" \
                 --upload-certs \
                 --ignore-preflight-errors=NumCPU
  register: kubeadm_init_output
  when: inventory_hostname == groups['k8s_manager'][0]
  args:
    creates: /etc/kubernetes/admin.conf

- name: Create .kube directory
  file:
    path: /home/ec2-user/.kube
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: '0755'
  when: inventory_hostname == groups['k8s_manager'][0]

- name: Copy admin.conf to user's kube config
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ec2-user/.kube/config
    remote_src: yes
    owner: ec2-user
    group: ec2-user
    mode: '0644'
  when: inventory_hostname == groups['k8s_manager'][0]

- name: Install Flannel CNI
  become: false
  command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  when: inventory_hostname == groups['k8s_manager'][0]

- name: Get join command for other managers
  shell: kubeadm token create --print-join-command
  register: join_command_raw
  when: inventory_hostname == groups['k8s_manager'][0]

- name: Get certificate key for other managers
  shell: kubeadm init phase upload-certs --upload-certs | tail -1
  register: certificate_key_raw
  when: inventory_hostname == groups['k8s_manager'][0]

- name: Set join command and certificate key facts
  set_fact:
    join_command: "{{ join_command_raw.stdout_lines[0] }}"
    certificate_key: "{{ certificate_key_raw.stdout_lines[0] }}"
  when: inventory_hostname == groups['k8s_manager'][0]

- name: Check if already joined as control plane
  stat:
    path: /etc/kubernetes/admin.conf
  register: control_plane_stat

- name: Join additional managers
  shell: "{{ hostvars[groups['k8s_manager'][0]]['join_command'] }} --control-plane --certificate-key {{ hostvars[groups['k8s_manager'][0]]['certificate_key'] }} --ignore-preflight-errors=NumCPU"
  when: 
    - inventory_hostname != groups['k8s_manager'][0]
    - not control_plane_stat.stat.exists
  register: join_result
  failed_when: join_result.rc != 0 and 'already exists' not in join_result.stderr
